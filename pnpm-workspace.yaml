packages:
  - packages/*
  - apps/*
  - scripts/*

# Minutes. A version must be three days old before pnpm resolves it, which covers hand
# added packages and lockfile maintenance, not only Renovate PRs.
minimumReleaseAge: 4320

# Install scripts nothing needs; listing them keeps installs warning free.
# protobufjs (under the flagd provider) only prints a version hint. esbuild only checks
# that its platform binary is present, which the optional dependency already guarantees.
ignoredBuiltDependencies: [esbuild, protobufjs]

# The flagd provider's gRPC sync kept reconnecting after close and held the process open;
# the patch adds a closed guard. Drop it once a provider release stops on close.
patchedDependencies:
  '@openfeature/flagd-provider@0.17.0': scripts/patches/@openfeature__flagd-provider@0.17.0.patch

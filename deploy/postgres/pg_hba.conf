# Login rules for the compose stack. The server reads this file, mounted read only, instead of
# the one in the data directory, so the rules hold from the very first start, whether or not
# init finished. The first matching line wins.

# The socket checks the OS user, so only the postgres user in the container is the superuser.
local   all           all        peer

# Nothing needs the superuser over TCP: the bootstrap and operators use the socket. Nothing
# replicates either, and a replication session would copy every tenant's data. postgres here
# must match POSTGRES_USER in compose.yaml; change both together.
host    all           postgres   all   reject
host    replication   all        all   reject

# Every other TCP login, loopback included, needs the role's password.
host    all           all        all   scram-sha-256

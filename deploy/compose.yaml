# Self host stack. Start it with scripts/selfhost.sh up; see deploy/README.md.
name: drefyn

services:
  postgres:
    # Same Postgres major as the hosted database on its newest patched minor, with a pgvector
    # whose SQL matches what hosted ships, so a query that works here works there. The digest
    # is the multi arch index, so amd64 and arm64 hosts get the same build.
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    # The image starts as root only to chown the data directory and drop to postgres. A
    # fresh named volume already belongs to postgres, so start there and skip root.
    user: postgres
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # A runaway query or connection storm should hit these before it takes the host down.
    # Postgres needs a process per connection plus about ten of its own, so 512 leaves room.
    pids_limit: 512
    mem_limit: ${DREFYN_POSTGRES_MEMORY_LIMIT:-1g}
    environment:
      POSTGRES_DB: drefyn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # postgres/pg_hba.conf names this user in its superuser reject line; change both together.
      # The server reads its login rules from that file. These only make the data directory's
      # copy ask for a password on TCP; that copy still lets the superuser in, which is why the
      # healthcheck fails unless the server reads the mounted file.
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    # The login rules come from a read only file rather than the data directory, so they hold
    # from the first start even when init stops halfway. The image passes these arguments to
    # the temporary init server too.
    # Filter row lists need the covering key in memory, and checkpoints far enough apart that
    # steady saves do not stall on full page writes. One line, because the self host tests
    # swap this line whole to change what the server loads.
    # prettier-ignore
    command: [postgres, -c, hba_file=/etc/drefyn/pg_hba.conf, -c, shared_buffers=256MB, -c, max_wal_size=2GB]
    # Passed as secrets so they show up as files in the container, not in docker inspect.
    # Compose copies these into the container before start, which is why the root
    # filesystem cannot be read only.
    secrets:
      - postgres_password
      - drefyn_owner_password
      - drefyn_app_password
      - drefyn_public_reader_password
      - drefyn_auth_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/bootstrap.sql:/etc/drefyn/bootstrap.sql:ro
      # Both the bootstrap and the upgrade scripts include it, relative to their own path.
      - ./postgres/quiet-log.sql:/etc/drefyn/quiet-log.sql:ro
      - ./postgres/upgrade:/etc/drefyn/upgrade:ro
      - ./postgres/healthcheck.sh:/etc/drefyn/healthcheck.sh:ro
      - ./postgres/pg_hba.conf:/etc/drefyn/pg_hba.conf:ro
    ports:
      - 127.0.0.1:${DREFYN_POSTGRES_PORT:-55432}:5432
    # Logs in as every role with its secret, so a failed bootstrap or a password that no
    # longer matches the database never reports healthy.
    healthcheck:
      test: [CMD, sh, /etc/drefyn/healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    # Fast shutdown can take a while with a busy buffer cache; a kill means crash recovery.
    stop_grace_period: 30s
    restart: unless-stopped

  # Test only, so it never starts with the stack: docker compose --profile test up mailpit.
  # Catches the dashboard's mail for the auth flows and e2e specs over plain SMTP on loopback.
  # MIT licensed; the digest is the multi arch index (amd64 and arm64) of v1.32.0, the same
  # image scripts/email-integration pins.
  mailpit:
    profiles: [test]
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    # Both ports are above 1024 and messages live in /tmp, so it needs no root at all.
    user: '65534:65534'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 256m
    environment:
      # Old messages are dropped past this, so a long run cannot fill memory.
      MP_MAX_MESSAGES: '500'
      # It looks up each client before its banner, so a lost DNS reply holds up the mail and
      # a test can time out on a resolver it never meant to depend on.
      MP_SMTP_DISABLE_RDNS: 'true'
      # The API answers only to loopback names, which closes DNS rebinding.
      MP_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - 127.0.0.1:${DREFYN_MAILPIT_SMTP_PORT:-51025}:1025
      - 127.0.0.1:${DREFYN_MAILPIT_WEB_PORT:-58025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  # Parses customer pages, which are hostile input. Off by default until the app tier joins this
  # stack: docker compose --profile parse up. The boundary is this service: no credentials, no
  # volume, no published port, and a network with no way out. Node has no network permission,
  # so this is the only thing that closes egress. Anything added here must leave that true.
  parse-host:
    profiles: [parse]
    build:
      context: ..
      dockerfile: deploy/parse-host/Dockerfile
    image: drefyn-parse-host:local
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    # Two threads and the supervisor. A page that gets this far has no business with more.
    pids_limit: 128
    # Native memory passes the heap cap, so only the OS bounds this. The host checks the same
    # number at start. No swap, or a flood would slow everyone down before it was stopped.
    mem_limit: ${DREFYN_PARSE_HOST_MEMORY_MB:-2048}m
    memswap_limit: ${DREFYN_PARSE_HOST_MEMORY_MB:-2048}m
    environment:
      DREFYN_PARSE_BIND: 0.0.0.0
      DREFYN_PARSE_PORT: '8787'
      DREFYN_PARSE_HOST_MEMORY_MB: ${DREFYN_PARSE_HOST_MEMORY_MB:-2048}
      # The hash of the token the app tier sends. Empty stops the host: there is no default.
      DREFYN_PARSE_TOKEN_SHA256: ${DREFYN_PARSE_TOKEN_SHA256:-}
    networks: [parse]
    # A page in flight can take a whole kill grace to end.
    stop_grace_period: 15s
    restart: unless-stopped

secrets:
  postgres_password:
    environment: DREFYN_POSTGRES_PASSWORD
  drefyn_owner_password:
    environment: DREFYN_OWNER_PASSWORD
  drefyn_app_password:
    environment: DREFYN_APP_PASSWORD
  drefyn_public_reader_password:
    environment: DREFYN_PUBLIC_READER_PASSWORD
  drefyn_auth_password:
    environment: DREFYN_AUTH_PASSWORD

networks:
  # internal drops the route out, so nothing reaches the internet. It leaves the bridge an
  # address on the machine, though, and anything listening on all interfaces answers there, so
  # that goes too. The app tier joins this network to reach the parse host, and nothing else
  # belongs on it.
  parse:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: 'true'

volumes:
  pgdata:
    # Lets the self host scripts tell this volume from one another checkout or an older stack
    # left under the same project name. It comes from deploy/.env, so plain docker compose and
    # the scripts always write the same label; newer Compose offers to recreate a volume whose
    # labels changed, which would delete the data.
    labels:
      com.drefyn.selfhost.stack-id: ${DREFYN_STACK_ID:?add DREFYN_STACK_ID with any random value to deploy/.env; scripts/selfhost.sh up writes it in a new file}

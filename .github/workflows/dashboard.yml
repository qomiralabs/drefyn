name: Dashboard

# No path filter, so these jobs can become required checks without leaving a PR pending.
on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: dashboard-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # The stack runs on the runner, on the same bootstrap as e2e (database) and operators, and
  # the seed makes real people and sessions on it. Playwright alone runs in the pinned image
  # the screenshot baselines were made in, so browsers, fonts and system libraries match. The
  # Playwright config serves the build through server.ts, once with the release flag on and
  # once off.
  e2e:
    name: dashboard ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            shell-chromium,
            shell-firefox,
            shell-webkit,
            flag-off,
            axe,
            reduced-motion,
            bundle,
            auth,
            auth-no-js,
            auth-hop,
            visual-1,
            visual-2,
            visual-3,
          ]
    env:
      # A project of its own per job and attempt, so nothing assumes the default name.
      COMPOSE_PROJECT_NAME: drefyn-dash-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
      DREFYN_POSTGRES_PORT: '55432'
      DREFYN_DATABASE_SSL: disable
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the compose stack
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 90
        run: bash scripts/selfhost.sh up
      - name: Start Mailpit
        run: docker compose --file deploy/compose.yaml --profile test up --detach --wait mailpit
      - run: pnpm --filter @drefyn/dashboard build
      - name: Seed people and sessions
        env:
          DREFYN_E2E_SEED: real-stack-e2e
        run: pnpm --filter @drefyn/dashboard seed:e2e
      # Three visual runs until zero tolerance screenshots have proven stable at scale; a
      # missing baseline fails, since the config never writes snapshots.
      - name: playwright ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        # Node comes from the runner, mounted read only; the host network reaches Postgres.
        # The add-host lines are the egress block: in this container every provider host is
        # loopback, so no test can reach a real one whatever the fake does. The check after
        # the tests fails the job if the block is gone or a server tried to leave anyway.
        run: |
          docker run --rm --ipc=host --network host \
            --add-host github.com:127.0.0.1 \
            --add-host api.github.com:127.0.0.1 \
            --add-host accounts.google.com:127.0.0.1 \
            --add-host oauth2.googleapis.com:127.0.0.1 \
            --add-host www.googleapis.com:127.0.0.1 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/apps/dashboard" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e PATH="/opt/node/bin:/usr/bin:/bin" -e PROJECT -e DREFYN_PLAYWRIGHT_IMAGE \
            "$DREFYN_PLAYWRIGHT_IMAGE" sh -c 'node_modules/.bin/playwright test --project="${PROJECT%-[0-9]}" && node e2e/egress-check.ts'
      - name: Postgres log
        if: failure()
        run: docker compose -f deploy/compose.yaml logs postgres
      - name: upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-${{ matrix.project }}
          path: apps/dashboard/test-results
          if-no-files-found: warn
          retention-days: 14

  # The client IP wrapper over real sockets, and the production build behind server.ts with
  # forged Host and forwarding headers. On the runner, not the Playwright image, for curl.
  server:
    name: dashboard server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The name the seed's guard expects, so it runs here and on no real stack.
      COMPOSE_PROJECT_NAME: drefyn-dash-99-${{ github.run_id }}-${{ github.run_attempt }}
      DREFYN_POSTGRES_PORT: '55432'
      DREFYN_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the compose stack
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 90
        run: bash scripts/selfhost.sh up
      - run: pnpm --filter @drefyn/dashboard build
      - name: Seed people and sessions
        env:
          DREFYN_E2E_SEED: real-stack-e2e
        run: pnpm --filter @drefyn/dashboard seed:e2e
      - name: wrapper and built server
        run: pnpm --filter @drefyn/dashboard test:server
      - name: wrapper p99 under 0.2 ms
        run: pnpm --filter @drefyn/dashboard bench:wrapper

name: Dashboard

# No path filter, so these jobs can become required checks without leaving a PR pending.
on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: dashboard-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Every job runs inside the pinned Playwright image, the one the screenshot baselines were
  # made in, so browsers, fonts and system libraries match and nothing is downloaded at test
  # time. The app is built in the job and served with next start, once with the release
  # flag on and once off, by the Playwright config.
  e2e:
    name: dashboard ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            shell-chromium,
            shell-firefox,
            shell-webkit,
            flag-off,
            axe,
            reduced-motion,
            bundle,
            visual-1,
            visual-2,
            visual-3,
          ]
    env:
      HOME: /root
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drefyn/dashboard build
      # Three visual runs until zero tolerance screenshots have proven stable at scale; a
      # missing baseline fails, since the config never writes snapshots.
      - name: playwright ${{ matrix.project }}
        working-directory: apps/dashboard
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright test --project="${PROJECT%-[0-9]}"
      - name: upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-${{ matrix.project }}
          path: apps/dashboard/test-results
          if-no-files-found: warn
          retention-days: 14

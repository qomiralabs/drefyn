# Bootstrap for the review gate, and only that.
#
# Until development holds scripts/review-gate, review-gate.yml has no trusted copy of the
# gate to run and steps aside. For same repo PRs into development this workflow runs the
# PR head's copy instead. It only listens to pull_request and pull_request_review, so it
# never runs with a privileged token for a comment or dispatch, and the job that runs PR
# code has read-only scopes. `report` re-reads the head from the API before posting the
# same `review-gate` status context that review-gate.yml uses.
#
# It exists only until the gate script is on development and is deleted by #3. The report
# step is a copy of the one in review-gate.yml rather than a shared action, because a
# local action would need a checkout inside the job that can write statuses.

name: Review gate bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: review-gate-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evaluate:
    name: evaluate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the base and the PR head
      pull-requests: read # PR head, labels, files and reviews
      issues: read # PR conversation comments
    outputs:
      needed: ${{ steps.script.outputs.needed }}
      state: ${{ steps.gate.outputs.state }}
      sha: ${{ steps.gate.outputs.sha }}
      description: ${{ steps.gate.outputs.description }}
    steps:
      - name: Check out the PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check whether the base already has the gate script
        id: script
        run: |
          if [ -f base/scripts/review-gate/src/cli.ts ]; then
            echo "::notice::the base has the gate script; review-gate.yml reports for this PR"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the PR head
        if: steps.script.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - if: steps.script.outputs.needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Evaluate
        if: steps.script.outputs.needed == 'true'
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node head/scripts/review-gate/src/cli.ts github
          --repo "$REPO" --pr "$PR_NUMBER"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  report:
    name: report
    needs: evaluate
    if: >-
      !cancelled() && needs.evaluate.result != 'skipped' &&
      needs.evaluate.outputs.needed != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # re-read the PR head
      statuses: write # post the review-gate status
    steps:
      - name: Set the review-gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_STATE: ${{ needs.evaluate.outputs.state }}
          GATE_SHA: ${{ needs.evaluate.outputs.sha }}
          GATE_DESCRIPTION: ${{ needs.evaluate.outputs.description }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::no PR number to report on"
            exit 1
          fi
          # The current head comes from the API, not from evaluate, which may have run PR code.
          head="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if ! is_sha "$head"; then
            echo "::error::could not read the PR head"
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_HEAD_SHA" != "$head" ]; then
            echo "::error::the PR moved on to ${head}; that push runs its own gate"
            exit 1
          fi

          state="$GATE_STATE"
          description="$GATE_DESCRIPTION"
          case "$state" in
            success|failure)
              if [ "$GATE_SHA" != "$head" ]; then
                echo "::error::evaluate reported ${GATE_SHA:-no SHA}, but the PR head is ${head}"
                exit 1
              fi
              ;;
            *)
              # No usable result. An error status cannot help anyone pass, so it is posted
              # on the head read above to fail closed.
              state=error
              description="the gate could not evaluate this PR"
              ;;
          esac

          gh api --method POST "repos/${REPO}/statuses/${head}" \
            -f state="$state" -f context=review-gate \
            -f description="${description:0:140}" -f target_url="$RUN_URL" > /dev/null
          echo "review-gate: ${state} on ${head}: ${description}"
          if [ "$state" = error ]; then
            echo "::error::the gate produced no result"
            exit 1
          fi

name: UI

# No path filter, so these jobs can become required checks without leaving a PR pending.
on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drefyn/ui storybook:build
      # Built once here; every browser job tests this exact artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: error
          retention-days: 14

  # Every browser job runs Playwright through in-container.ts, which starts the pinned
  # Playwright image with no network. Browsers and system libraries come from the image,
  # so nothing is downloaded at test time and runner image updates cannot change them.
  browser:
    name: ${{ matrix.project }}
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [keyboard-chromium, keyboard-firefox, keyboard-webkit, axe, reduced-motion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
      - name: playwright ${{ matrix.project }} in the pinned image
        working-directory: packages/ui
        env:
          PROJECT: ${{ matrix.project }}
        run: node scripts/in-container.ts playwright test --project="$PROJECT"

  # Three independent runs until zero tolerance screenshots have proven stable at scale.
  visual:
    name: visual (run ${{ matrix.run }})
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
      # The same command as on a laptop. A missing baseline fails, since the config
      # never writes snapshots outside test:visual:update.
      - run: pnpm --filter @drefyn/ui test:visual
      - name: upload the diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-run-${{ matrix.run }}
          path: packages/ui/test-results
          if-no-files-found: warn
          retention-days: 14

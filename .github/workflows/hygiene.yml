name: Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: hygiene-${{ github.event.pull_request.number }}
  # Only PR runs go stale; branch pushes and schedules must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The checker uses only Node built-ins, so no install step is needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Tracked files
        run: node scripts/hygiene/src/cli.ts --files
      - name: Commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/hygiene/src/cli.ts --commits "${BASE_SHA}..${HEAD_SHA}"
      # Title and body arrive through env vars; expanding them inside the script would let
      # a crafted PR title run shell commands.
      - name: PR title and body
        env:
          HYGIENE_PR_TITLE: ${{ github.event.pull_request.title }}
          HYGIENE_PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/hygiene/src/cli.ts --pr

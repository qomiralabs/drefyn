name: E2E

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  db:
    name: e2e (database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # A project of its own per attempt, so the tests never assume the default name.
      COMPOSE_PROJECT_NAME: drefyn-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      DREFYN_POSTGRES_PORT: '55432'
      DREFYN_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the compose stack
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 90
        run: bash scripts/selfhost.sh up
      # CI is set on the runner, so an unreachable stack fails here rather than skipping. The
      # unit, integration and serial runs each leave a coverage blob, and the merge holds the
      # tenancy files to 95 percent: some of them only run against a real Postgres.
      - name: Unit and integration tests with merged coverage
        run: pnpm --filter @drefyn/db test:merged
      - name: check:sources passes on the shipped migrations and the repository
        run: pnpm --filter @drefyn/db check:sources
      # check:types migrates what it is given, so each run gets a fresh copy of the
      # bootstrapped database with its grants and search_path.
      - name: Fresh databases for check:types
        run: |
          for name in drefyn_types_clean drefyn_types_fixture; do
            docker compose -f deploy/compose.yaml exec -T postgres \
              psql --no-psqlrc -q -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          create database $name template drefyn;
          update pg_database set datacl = (select datacl from pg_database where datname = 'drefyn')
            where datname = '$name';
          alter database $name set search_path = app, extensions;
          SQL
          done
      - name: check:types passes on the shipped migrations
        run: |
          owner="$(grep '^DREFYN_OWNER_PASSWORD=' deploy/.env | cut -d= -f2)"
          echo "::add-mask::$owner"
          export DREFYN_MIGRATION_DATABASE_URL="postgres://drefyn_owner:${owner}@127.0.0.1:${DREFYN_POSTGRES_PORT}/drefyn_types_clean"
          pnpm --filter @drefyn/db check:types
      # Reads the catalog of the database check:types just migrated.
      - name: check:catalog passes on the shipped migrations
        run: |
          owner="$(grep '^DREFYN_OWNER_PASSWORD=' deploy/.env | cut -d= -f2)"
          echo "::add-mask::$owner"
          export DREFYN_MIGRATION_DATABASE_URL="postgres://drefyn_owner:${owner}@127.0.0.1:${DREFYN_POSTGRES_PORT}/drefyn_types_clean"
          pnpm --filter @drefyn/db check:catalog
      - name: check:types fails on a migration without regenerated types
        run: |
          owner="$(grep '^DREFYN_OWNER_PASSWORD=' deploy/.env | cut -d= -f2)"
          echo "::add-mask::$owner"
          export DREFYN_MIGRATION_DATABASE_URL="postgres://drefyn_owner:${owner}@127.0.0.1:${DREFYN_POSTGRES_PORT}/drefyn_types_fixture"
          dir="$(mktemp -d)"
          cp packages/db/migrations/*.sql "$dir"/
          printf -- '-- Up Migration\ncreate table app.widgets (id uuid primary key default uuidv7());\n\n-- Down Migration\ndrop table app.widgets;\n' \
            > "$dir/9000000000001_widgets.sql"
          set +e
          pnpm --silent --filter @drefyn/db check:types --migrations-dir "$dir" > "$RUNNER_TEMP/types.out" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/types.out"
          if [ "$code" -ne 1 ] || ! grep -q 'widgets' "$RUNNER_TEMP/types.out"; then
            echo "expected check:types to exit 1 naming widgets, got exit $code" >&2
            exit 1
          fi
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --timestamps postgres
      - name: Tear down
        if: always()
        run: bash scripts/selfhost.sh reset --yes

  upgrade:
    name: e2e (database upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history, so the test can rebuild the stack from the commit before drefyn_auth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Docker and Compose versions
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
      # Builds a volume with the previous bootstrap, upgrades it twice, refuses a role with
      # other attributes, and greps the server log and pg_stat_statements for the password.
      - name: Upgrade a volume made by the previous bootstrap
        env:
          DREFYN_UPGRADE_TEST_PROJECT: drefyn-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/selfhost-upgrade-test.sh

  email:
    name: e2e (email smtp)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A project of its own per attempt, so a rerun never meets a stale container.
      COMPOSE_PROJECT_NAME: drefyn-email-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Makes fresh certificates and an AUTH password, starts Mailpit by digest, runs the
      # SMTP integration tests and removes the containers and the certificates.
      - name: SMTP integration tests against Mailpit
        run: bash scripts/email-integration.sh

name: Self host

on:
  pull_request:
    paths:
      - deploy/**
      - scripts/selfhost*.sh
      - .github/workflows/selfhost.yml
  push:
    branches: [development, staging, main]
    paths:
      - deploy/**
      - scripts/selfhost*.sh
      - .github/workflows/selfhost.yml

permissions: {}

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Newer Compose compares volume labels on every up, so record which one this run proved.
      - name: Docker and Compose versions
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
      - name: Scripts refuse a project created by another compose file
        run: bash scripts/selfhost-guard-test.sh
      - name: Wrong or short passwords never report healthy
        run: bash scripts/selfhost-password-test.sh
      # The same commands a self hoster runs, from a clean runner with no volume. The wait
      # matches the promise that a clean start is healthy within a minute.
      - name: Start
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 60
        run: bash scripts/selfhost.sh up
      - name: Smoke check
        run: bash scripts/selfhost-smoke.sh
      - name: Restart keeps the data and the roles
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 60
        run: |
          bash scripts/selfhost.sh restart
          bash scripts/selfhost-smoke.sh
      - name: Tear down
        run: bash scripts/selfhost-smoke.sh --teardown
      # The test scripts print their own stacks' logs when a check fails, because they remove
      # those stacks themselves. This covers the main stack. The ID only satisfies compose's
      # interpolation when no deploy/.env was written; logs never reads it.
      - name: Logs
        if: failure()
        env:
          DREFYN_STACK_ID: logs-only
        run: docker compose -f deploy/compose.yaml logs --no-color --timestamps

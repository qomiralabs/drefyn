name: Self host

on:
  pull_request:
    paths:
      - deploy/**
      - scripts/selfhost*.sh
      - .github/workflows/selfhost.yml
  push:
    branches: [development, staging, main]
    paths:
      - deploy/**
      - scripts/selfhost*.sh
      - .github/workflows/selfhost.yml

permissions: {}

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Newer Compose compares volume labels on every up, so record which one this run proved.
      - name: Docker and Compose versions
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
      - name: Scripts refuse a project created by another compose file
        run: bash scripts/selfhost-guard-test.sh
      - name: Wrong or short passwords never report healthy
        run: bash scripts/selfhost-password-test.sh
      - name: The installer generates the auth keys once and prints none
        run: bash scripts/selfhost-env-test.sh
      # The same commands a self hoster runs, from a clean runner with no volume. The wait
      # matches the promise that a clean start is healthy within a minute.
      - name: Start
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 60
        run: bash scripts/selfhost.sh up
      - name: Smoke check
        run: bash scripts/selfhost-smoke.sh
      - name: Restart keeps the data and the roles
        env:
          DREFYN_SELFHOST_WAIT_SECONDS: 60
        run: |
          bash scripts/selfhost.sh restart
          bash scripts/selfhost-smoke.sh
      # Off by default, so it never starts with the stack; started here from its digest, as
      # the non root user, and removed again before the tear down checks the project.
      - name: Mailpit test profile is healthy from its pinned digest
        run: |
          mailpit=(docker compose -f deploy/compose.yaml --profile test)
          "${mailpit[@]}" up --detach --wait --wait-timeout 60 mailpit
          id="$("${mailpit[@]}" ps -q mailpit)"
          docker inspect --format 'image {{.Config.Image}} user {{.Config.User}} health {{.State.Health.Status}}' "$id"
          docker image inspect --format 'digests {{.RepoDigests}}' "$(docker inspect --format '{{.Image}}' "$id")"
          curl -fsS --max-time 5 http://127.0.0.1:58025/readyz
          "${mailpit[@]}" rm --stop --force mailpit
      - name: Tear down
        run: bash scripts/selfhost-smoke.sh --teardown
      # The test scripts print their own stacks' logs when a check fails, because they remove
      # those stacks themselves. This covers the main stack. The placeholder ID always wins
      # over deploy/.env, and is only there so compose can interpolate; logs never uses it.
      - name: Logs
        if: failure()
        env:
          DREFYN_STACK_ID: logs-only
        run: docker compose -f deploy/compose.yaml logs --no-color --timestamps

name: Site

# No path filter, so these jobs can become required checks without leaving a PR pending.
on:
  pull_request:
  # The merge queue waits for the required checks on its own commit, so they run there too.
  merge_group:
    types: [checks_requested]
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rendered pages are served from memory inside the pinned Playwright image, with no
  # network, so each engine checks the policy on the exact bytes the renderer returns.
  csp:
    name: site csp (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: playwright ${{ matrix.project }} in the pinned image
        env:
          PROJECT: ${{ matrix.project }}
        # Node comes from the runner, mounted read only, so the tests run on the same Node as
        # the gate.
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e PATH="/opt/node/bin:/usr/bin:/bin" -e PROJECT \
            "$DREFYN_PLAYWRIGHT_IMAGE" sh -c 'node_modules/.bin/playwright test --project="$PROJECT"'
      - name: upload the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-csp-${{ matrix.project }}
          path: packages/site/test-results
          if-no-files-found: warn
          retention-days: 14

  # The public page gates run on pages rendered by this package and served over HTTP from
  # loopback inside the pinned image, with no network. Lighthouse, the JS weighed in the
  # browser and the first response size share one job, one test at a time, so no score is
  # taken while a neighbour holds the CPU.
  gates-budgets:
    name: site gates budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: budgets in the pinned image
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e DREFYN_PLAYWRIGHT_IMAGE -e PATH="/opt/node/bin:/usr/bin:/bin" \
            "$DREFYN_PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright test -c playwright.gates.config.ts --project=budgets
      - name: upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-gates-budgets
          path: packages/site/test-results/
          if-no-files-found: warn
          retention-days: 14

  # Scripts off, axe, keyboard and reduced motion, each on every engine.
  gates:
    name: site gates (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gates on ${{ matrix.project }} in the pinned image
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e DREFYN_PLAYWRIGHT_IMAGE -e PATH="/opt/node/bin:/usr/bin:/bin" -e PROJECT \
            "$DREFYN_PLAYWRIGHT_IMAGE" \
            sh -c 'node_modules/.bin/playwright test -c playwright.gates.config.ts --project="$PROJECT"'
      - name: upload the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-gates-${{ matrix.project }}
          path: packages/site/test-results/
          if-no-files-found: warn
          retention-days: 14

  # Three independent runs, each on all three engines, until zero tolerance screenshots have
  # proven stable at scale. A missing baseline fails, since the config never writes one.
  gates-visual:
    name: site gates visual (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: visual in the pinned image
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e DREFYN_PLAYWRIGHT_IMAGE -e PATH="/opt/node/bin:/usr/bin:/bin" \
            "$DREFYN_PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright test -c playwright.gates.config.ts \
              --project=visual-chromium --project=visual-firefox --project=visual-webkit
      - name: upload the diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-gates-visual-run-${{ matrix.run }}
          path: packages/site/test-results/
          if-no-files-found: warn
          retention-days: 14

  # Each gate run again on a page broken on purpose, which must fail exactly that gate. A
  # gate that stops measuring would otherwise pass everything in the jobs above.
  gates-controls:
    name: site gates controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: controls in the pinned image
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e DREFYN_PLAYWRIGHT_IMAGE -e PATH="/opt/node/bin:/usr/bin:/bin" \
            "$DREFYN_PLAYWRIGHT_IMAGE" \
            node gates/controls.ts

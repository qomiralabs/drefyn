name: Site

# No path filter, so these jobs can become required checks without leaving a PR pending.
on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs go stale; branch pushes must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rendered pages are served from memory inside the pinned Playwright image, with no
  # network, so each engine checks the policy on the exact bytes the renderer returns.
  csp:
    name: site csp (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      DREFYN_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: playwright ${{ matrix.project }} in the pinned image
        env:
          PROJECT: ${{ matrix.project }}
        # Node comes from the runner, mounted read only, so the tests run on the same Node as
        # the gate.
        run: |
          docker run --rm --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/site" \
            -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            -e HOME=/root -e CI -e PATH="/opt/node/bin:/usr/bin:/bin" -e PROJECT \
            "$DREFYN_PLAYWRIGHT_IMAGE" sh -c 'node_modules/.bin/playwright test --project="$PROJECT"'
      - name: upload the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-csp-${{ matrix.project }}
          path: packages/site/test-results
          if-no-files-found: warn
          retention-days: 14
